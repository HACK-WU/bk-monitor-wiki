# Config: /root/.config/memory-mcp/config.yaml

dbPath: ~/.local/share/memory-mcp/lancedb
embedding:
  apiKey: ${SILICONFLOW_API_KEY}
  model: Qwen/Qwen3-Embedding-8B
  baseURL: https://api.siliconflow.cn/v1
  dimensions: 4096
autoCapture: true
autoRecall: false
smartExtraction: true
extractMinMessages: 2
extractMaxChars: 8000
enableManagementTools: true
sessionStrategy: none
retrieval:
  mode: hybrid
  vectorWeight: 0.7
  bm25Weight: 0.3
  filterNoise: true
  minScore: 0.3
  hardMinScore: 0.35
  rerank: cross-encoder
  rerankProvider: siliconflow
  rerankModel: Qwen/Qwen3-Reranker-8B
  rerankEndpoint: https://api.siliconflow.cn/v1/rerank
  rerankApiKey: ${SILICONFLOW_API_KEY}
scopes:
  default: global
  definitions:
    monitor:
      description: BK-Monitor Wiki 文档知识库
      acl:
        - global
        - monitor
    monitor-memory:
      description: BK-Monitor 项目记忆
      acl:
        - global
        - monitor-memory
    user-profile:
      description: 用户画像（全局固定）
      acl:
        - global
        - user-profile
selfImprovement:
  enabled: true
  beforeResetNote: true
  ensureLearningFiles: true