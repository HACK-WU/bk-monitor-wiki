<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="发版期间先关掉提醒、到点自动恢复的直觉图">
  <rect width="900" height="440" fill="#f7f9fc"/>

  <text x="30" y="38" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#1f2733">发版那段时间，先把“提醒”关掉；到点自动打开</text>
  <text x="30" y="60" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6b7787">同一场发版，两种情形对比：没有这道开关 / 有这道开关　　　竖着看＝提醒有多少　横着看＝时间</text>

  <!-- ============ 左：没有这道开关 ============ -->
  <rect x="30" y="78" width="400" height="252" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="50" y="104" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#1f2733">没有这道开关</text>

  <!-- 时间轴 -->
  <line x1="50" y1="290" x2="410" y2="290" stroke="#b9c4d4" stroke-width="1.5"/>
  <line x1="130" y1="120" x2="130" y2="290" stroke="#dfe4ec" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="330" y1="120" x2="330" y2="290" stroke="#dfe4ec" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="132" y="304" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6b7787">开始发版</text>
  <text x="332" y="304" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6b7787">发版结束</text>

  <!-- 提醒量：发版期间尖峰密集 -->
  <path d="M50,272 L64,262 L72,268 L86,258 L98,266 L110,256 L120,264
           L130,268 L140,176 L150,262 L160,150 L170,258 L180,164 L190,254
           L200,142 L210,258 L220,168 L230,148 L240,256 L250,158 L260,250
           L270,146 L280,258 L290,170 L300,152 L310,254 L320,168 L330,262
           L342,258 L356,266 L368,256 L382,264 L396,258 L410,272"
        fill="none" stroke="#e04a4a" stroke-width="2"/>
  <rect x="130" y="120" width="200" height="170" fill="#e04a4a" opacity="0.06"/>
  <text x="160" y="140" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#c0392b">提醒一条接一条</text>
  <text x="60" y="200" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#e04a4a">值班的人先被刷屏，</text>
  <text x="60" y="220" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#e04a4a">真出问题时反而没人看</text>

  <!-- ============ 右：有这道开关 ============ -->
  <rect x="470" y="78" width="400" height="252" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="490" y="104" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#1f2733">有这道开关</text>

  <line x1="490" y1="290" x2="850" y2="290" stroke="#b9c4d4" stroke-width="1.5"/>
  <line x1="570" y1="120" x2="570" y2="290" stroke="#dfe4ec" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="770" y1="120" x2="770" y2="290" stroke="#dfe4ec" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="572" y="304" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6b7787">开始发版</text>
  <text x="772" y="304" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6b7787">到点自动恢复</text>

  <!-- 开关区间高亮 -->
  <rect x="570" y="120" width="200" height="170" fill="#14a568" opacity="0.07"/>
  <!-- 平静段（被按住） -->
  <path d="M490,272 L506,266 L524,272 L542,264 L560,272 L570,268"
        fill="none" stroke="#14a568" stroke-width="2"/>
  <path d="M570,268 L770,268" fill="none" stroke="#14a568" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M770,268 L790,262 L806,270 L824,264 L842,272 L850,268"
        fill="none" stroke="#14a568" stroke-width="2"/>

  <text x="596" y="150" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#14683f">这段时间的提醒被按住</text>
  <text x="596" y="172" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6b7787">（记录照常，只是不再往外喊）</text>
  <text x="776" y="240" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#14683f">自己恢复</text>

  <!-- ============ 底部结论条 ============ -->
  <rect x="30" y="348" width="840" height="62" rx="8" fill="#eef4ff" stroke="#cfdffd"/>
  <text x="50" y="374" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#2b4a7d">只关“这段时间的提醒”，不停记录；到点自动恢复。</text>
  <text x="50" y="396" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#2b4a7d">并且留下一条记录：谁、什么时候、关掉了哪些提醒。</text>
</svg>
