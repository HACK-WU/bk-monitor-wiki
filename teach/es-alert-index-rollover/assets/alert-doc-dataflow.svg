<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a6"/>
    </marker>
    <marker id="df-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb0"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="#fbfcfd"/>

  <text x="470" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2d3d">告警文档在索引间的流转</text>
  <text x="470" y="44" text-anchor="middle" font-size="11" fill="#6b7a8c">落点由 begin_time 决定 · ABNORMAL 文档每天被搬到当天索引 · 查询窗口上界必须恒为 now</text>

  <!-- ===== 阶段泳道 ===== -->
  <rect x="20" y="70" width="200" height="540" rx="8" fill="#f7f9fb" stroke="#dfe5ec" stroke-width="1"/>
  <text x="120" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a6c7d">① 告警接入</text>

  <rect x="240" y="70" width="200" height="540" rx="8" fill="#f7f9fb" stroke="#dfe5ec" stroke-width="1"/>
  <text x="340" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a6c7d">② 写入路由</text>

  <rect x="460" y="70" width="220" height="540" rx="8" fill="#f7f9fb" stroke="#dfe5ec" stroke-width="1"/>
  <text x="570" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a6c7d">③ 物理落点</text>

  <rect x="700" y="70" width="220" height="540" rx="8" fill="#f7f9fb" stroke="#dfe5ec" stroke-width="1"/>
  <text x="810" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a6c7d">④ 搬运与出口</text>

  <!-- ===== 节点 ===== -->
  <!-- event -->
  <rect x="42" y="120" width="156" height="70" rx="7" fill="#fdf3e7" stroke="#e0b978" stroke-width="1.4"/>
  <text x="120" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Event 接入</text>
  <text x="120" y="165" text-anchor="middle" font-size="10" fill="#5a6c7d">event.time 即 begin_time</text>
  <text x="120" y="181" text-anchor="middle" font-size="9" fill="#8a97a5">alarm_backends</text>

  <!-- alert -->
  <rect x="42" y="300" width="156" height="70" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="120" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Alert 文档构建</text>
  <text x="120" y="345" text-anchor="middle" font-size="10" fill="#5a6c7d">三个时间字段就位</text>
  <text x="120" y="361" text-anchor="middle" font-size="9" fill="#8a97a5">init_uid</text>

  <!-- route -->
  <rect x="262" y="300" width="156" height="70" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="340" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">_get_index 路由</text>
  <text x="340" y="345" text-anchor="middle" font-size="10" fill="#5a6c7d">按 begin_time 取写别名</text>
  <text x="340" y="361" text-anchor="middle" font-size="9" fill="#8a97a5">base.py:67</text>

  <!-- phys_new -->
  <rect x="482" y="150" width="176" height="76" rx="7" fill="#eaf5ee" stroke="#8fc0a0" stroke-width="1.4"/>
  <text x="570" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">begin_time 当天索引</text>
  <text x="570" y="197" text-anchor="middle" font-size="10" fill="#5a6c7d">文档初始落点</text>
  <text x="570" y="214" text-anchor="middle" font-size="9" fill="#8a97a5">写入锚点</text>

  <!-- phys_recover -->
  <rect x="482" y="330" width="176" height="76" rx="7" fill="#eaf5ee" stroke="#8fc0a0" stroke-width="1.4"/>
  <text x="570" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">恢复当天索引</text>
  <text x="570" y="377" text-anchor="middle" font-size="10" fill="#5a6c7d">终态停留处</text>
  <text x="570" y="394" text-anchor="middle" font-size="9" fill="#8a97a5">跨天恢复</text>

  <!-- reindex -->
  <rect x="722" y="130" width="176" height="76" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="810" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">reindex 搬运</text>
  <text x="810" y="177" text-anchor="middle" font-size="10" fill="#5a6c7d">ABNORMAL 且 create_time</text>
  <text x="810" y="192" text-anchor="middle" font-size="10" fill="#5a6c7d">不早于新索引日期</text>
  <text x="810" y="209" text-anchor="middle" font-size="9" fill="#8a97a5">op_type=create</text>

  <!-- window -->
  <rect x="722" y="310" width="176" height="76" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="810" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">时间窗推导</text>
  <text x="810" y="357" text-anchor="middle" font-size="10" fill="#5a6c7d">下界 begin_time</text>
  <text x="810" y="373" text-anchor="middle" font-size="10" fill="#5a6c7d">上界恒 now</text>
  <text x="810" y="390" text-anchor="middle" font-size="9" fill="#8a97a5">index_name_by_time</text>

  <!-- result -->
  <rect x="722" y="500" width="176" height="66" rx="7" fill="#fdf0f3" stroke="#dba3b3" stroke-width="1.4"/>
  <text x="810" y="526" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">查询结果</text>
  <text x="810" y="545" text-anchor="middle" font-size="10" fill="#5a6c7d">列表 / 详情 / 计数</text>
  <text x="810" y="561" text-anchor="middle" font-size="9" fill="#8a97a5">fta_web</text>

  <!-- ===== 流转连线 ===== -->
  <!-- event → alert -->
  <path d="M 120 190 L 120 296" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#df-e)"/>
  <text x="132" y="222" font-size="10" fill="#4a5b6c">生成 alert_id</text>
  <text x="132" y="236" font-size="9" fill="#8a97a5">前 10 位 = begin_time</text>

  <!-- alert → route -->
  <path d="M 198 335 L 258 335" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#df-e)"/>
  <text x="228" y="356" text-anchor="middle" font-size="10" fill="#4a5b6c">prepare_action</text>
  <text x="228" y="369" text-anchor="middle" font-size="9" fill="#8a97a5">bulk 写入</text>

  <!-- route → phys_new -->
  <path d="M 418 320 L 440 250 L 478 200" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#df-e)"/>
  <text x="352" y="278" font-size="10" fill="#4a5b6c">按 begin_time 落盘</text>
  <text x="352" y="292" font-size="9" fill="#8a97a5">write_{date}_{index}</text>

  <!-- route → phys_recover -->
  <path d="M 418 350 L 478 358" fill="none" stroke="#8b98a6" stroke-width="1.6" marker-end="url(#df)"/>
  <text x="434" y="382" font-size="10" fill="#4a5b6c">状态更新回写</text>
  <text x="434" y="395" font-size="9" fill="#8a97a5">终态停留</text>

  <!-- phys_new → reindex -->
  <path d="M 658 176 L 718 168" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#df-e)"/>
  <text x="664" y="146" text-anchor="middle" font-size="10" fill="#4a5b6c">命中搬运条件</text>
  <text x="664" y="159" text-anchor="middle" font-size="9" fill="#8a97a5">status=ABNORMAL</text>

  <!-- phys_new → phys_recover -->
  <path d="M 570 226 L 570 326" fill="none" stroke="#8b98a6" stroke-width="1.6" marker-end="url(#df)"/>
  <text x="580" y="254" font-size="10" fill="#4a5b6c">不满足则停留</text>
  <text x="580" y="267" font-size="9" fill="#8a97a5">create_time 过早</text>

  <!-- reindex → window -->
  <path d="M 810 206 L 810 306" fill="none" stroke="#8b98a6" stroke-width="1.6" marker-end="url(#df)"/>
  <text x="820" y="246" font-size="10" fill="#4a5b6c">新写入落点</text>
  <text x="820" y="259" font-size="9" fill="#8a97a5">参与查询</text>

  <!-- phys_recover → window -->
  <path d="M 658 358 L 718 348" fill="none" stroke="#8b98a6" stroke-width="1.6" marker-end="url(#df)"/>
  <text x="670" y="322" font-size="10" fill="#4a5b6c">历史落点</text>
  <text x="670" y="335" font-size="9" fill="#8a97a5">参与查询</text>

  <!-- window → result -->
  <path d="M 810 386 L 810 496" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#df-e)"/>
  <text x="820" y="424" font-size="10" fill="#4a5b6c">ES 查询返回</text>
  <text x="820" y="437" font-size="9" fill="#8a97a5">索引列表命中</text>

  <!-- ===== 底部铁律提示 ===== -->
  <rect x="20" y="620" width="900" height="62" rx="8" fill="#fff8e6" stroke="#e0b978" stroke-width="1.2"/>
  <text x="36" y="642" font-size="11.5" font-weight="bold" fill="#8a6d3b">查询收敛铁律</text>
  <text x="36" y="660" font-size="11" fill="#5a4a2c">各种落点（当天 / 恢复日 / 被搬到今天 / 原地停留）都落在 [begin_time, now] 区间内，这是唯一安全窗口。</text>
  <text x="36" y="675" font-size="11" fill="#5a4a2c">精确查询的索引窗口上界必须恒为 now；若上界取历史时间，被搬运到今天的文档将查不到。</text>
</svg>
