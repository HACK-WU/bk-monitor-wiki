<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="620" fill="#fbfcfd"/>
  <text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">bkfta_alert 索引布局与别名路由</text>
  <text x="540" y="56" text-anchor="middle" font-size="12" fill="#6b7a8c">物理索引按天切片 · 写别名唯一指向最新 · 读别名永久驻留</text>

  <!-- Timeline axis -->
  <line x1="70" y1="300" x2="1010" y2="300" stroke="#c3ccd6" stroke-width="1.5"/>

  <!-- Old index 1 -->
  <g>
    <rect x="80" y="190" width="230" height="80" rx="6" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.5"/>
    <text x="195" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">bkfta_alert_20260902_0</text>
    <text x="195" y="236" text-anchor="middle" font-size="11" fill="#5a6c7d">物理索引（历史）</text>
    <text x="195" y="256" text-anchor="middle" font-size="11" fill="#5a6c7d">已恢复告警停在此</text>
  </g>
  <rect x="80" y="278" width="230" height="22" rx="4" fill="#d6e4f0" stroke="#9fb3c8"/>
  <text x="195" y="293" text-anchor="middle" font-size="10" fill="#2c3e50">bkfta_alert_20260902_read</text>

  <!-- Old index 2 -->
  <g>
    <rect x="340" y="190" width="230" height="80" rx="6" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.5"/>
    <text x="455" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">bkfta_alert_20260903_0</text>
    <text x="455" y="236" text-anchor="middle" font-size="11" fill="#5a6c7d">物理索引（前一天）</text>
    <text x="455" y="256" text-anchor="middle" font-size="11" fill="#5a6c7d">reindex 源端</text>
  </g>
  <rect x="340" y="278" width="230" height="22" rx="4" fill="#d6e4f0" stroke="#9fb3c8"/>
  <text x="455" y="293" text-anchor="middle" font-size="10" fill="#2c3e50">bkfta_alert_20260903_read</text>

  <!-- Current index -->
  <g>
    <rect x="600" y="180" width="250" height="100" rx="7" fill="#e3f2e8" stroke="#4a9c6d" stroke-width="2.5"/>
    <text x="725" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e5c3a">bkfta_alert_20260904_0</text>
    <text x="725" y="228" text-anchor="middle" font-size="11" fill="#2d6b48">物理索引（当前最新）</text>
    <text x="725" y="248" text-anchor="middle" font-size="11" fill="#2d6b48">reindex 目标端</text>
    <text x="725" y="268" text-anchor="middle" font-size="11" fill="#2d6b48">新写入全部落此</text>
  </g>
  <rect x="600" y="288" width="250" height="24" rx="4" fill="#c8e6d0" stroke="#4a9c6d" stroke-width="1.5"/>
  <text x="725" y="305" text-anchor="middle" font-size="10" fill="#1e5c3a">bkfta_alert_20260904_read</text>

  <!-- Reserved future alias -->
  <g>
    <rect x="880" y="190" width="130" height="80" rx="6" fill="#fdf6e3" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="945" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1a">尚未创建</text>
    <text x="945" y="236" text-anchor="middle" font-size="11" fill="#8a6d1a">明日物理索引</text>
    <text x="945" y="256" text-anchor="middle" font-size="11" fill="#8a6d1a">跨天时生成</text>
  </g>

  <!-- Write alias box -->
  <rect x="380" y="90" width="440" height="62" rx="7" fill="#fde8e8" stroke="#c65353" stroke-width="2.5"/>
  <text x="600" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f2d2d">写别名（唯一，指向最新索引）</text>
  <text x="600" y="134" text-anchor="middle" font-size="12" fill="#8f2d2d">write_20260904_bkfta_alert　→　bkfta_alert_20260904_0</text>

  <!-- Write alias arrow -->
  <line x1="600" y1="152" x2="725" y2="180" stroke="#c65353" stroke-width="2.5"/>
  <polygon points="725,180 717,170 733,170" fill="#c65353"/>

  <!-- Reserved future write alias -->
  <rect x="880" y="90" width="130" height="62" rx="6" fill="#fdf6e3" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="945" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1a">预留写别名</text>
  <text x="945" y="132" text-anchor="middle" font-size="10" fill="#8a6d1a">write_20260905_...</text>
  <line x1="945" y1="152" x2="945" y2="190" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="945,190 940,181 950,181" fill="#d4a72c"/>

  <!-- Reindex arrow -->
  <path d="M 570 215 L 600 215" stroke="#4a9c6d" stroke-width="2.5"/>
  <polygon points="600,215 591,209 591,221" fill="#4a9c6d"/>
  <text x="585" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d6b48">reindex</text>

  <!-- Write routing -->
  <g>
    <rect x="80" y="380" width="930" height="70" rx="6" fill="#f4f6f8" stroke="#9fb3c8" stroke-width="1.2"/>
    <text x="100" y="403" font-size="12" font-weight="bold" fill="#2c3e50">写入路由</text>
    <text x="100" y="423" font-size="11" fill="#5a6c7d">_get_index() → get_index_time() = parse_timestamp_by_id(alert_id) = begin_time → date_str = YYYYMMDD → write_{date_str}_bkfta_alert</text>
    <text x="100" y="441" font-size="11" fill="#8f2d2d">注意：按文档自身的 begin_time 路由，不是按当前时间——3 天前触发的告警，今天更新仍写回 3 天前那个写别名</text>
  </g>

  <!-- Query routing -->
  <g>
    <rect x="80" y="466" width="930" height="70" rx="6" fill="#f4f6f8" stroke="#9fb3c8" stroke-width="1.2"/>
    <text x="100" y="489" font-size="12" font-weight="bold" fill="#2c3e50">查询路由</text>
    <text x="100" y="509" font-size="11" fill="#5a6c7d">build_index_name_by_time(start, end) → 按天枚举读别名 {index}_{YYYYMMDD}_read；跨度 &gt; 15 天退化为月通配 {index}_{YYYYMM}*_read</text>
    <text x="100" y="527" font-size="11" fill="#1e5c3a">铁律：精确 ID 查询上界必须 now（文档可能因 reindex 或恢复时间落在更晚的索引）；无法推断锚点走 all_indices=True</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80,556)">
    <rect x="0" y="0" width="16" height="14" rx="3" fill="#e3f2e8" stroke="#4a9c6d" stroke-width="2"/>
    <text x="24" y="12" font-size="11" fill="#2c3e50">当前最新索引</text>
    <rect x="160" y="0" width="16" height="14" rx="3" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.5"/>
    <text x="184" y="12" font-size="11" fill="#2c3e50">历史索引</text>
    <rect x="290" y="0" width="16" height="14" rx="3" fill="#fde8e8" stroke="#c65353" stroke-width="2"/>
    <text x="314" y="12" font-size="11" fill="#2c3e50">写别名（唯一）</text>
    <rect x="450" y="0" width="16" height="14" rx="3" fill="#d6e4f0" stroke="#9fb3c8"/>
    <text x="474" y="12" font-size="11" fill="#2c3e50">读别名（多份并存）</text>
    <rect x="640" y="0" width="16" height="14" rx="3" fill="#fdf6e3" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="664" y="12" font-size="11" fill="#2c3e50">预留 / 未创建</text>
  </g>
</svg>
