<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#8b98a6"/>
    </marker>
    <marker id="right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a6"/>
    </marker>
  </defs>

  <rect width="1080" height="430" fill="#fbfcfd"/>

  <text x="540" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">把所有记录堆在一处，还是按天装订成册</text>
  <text x="540" y="50" text-anchor="middle" font-size="11" fill="#6b7a8c">看图：上面是一本越写越厚的总账，翻找任何一条都要从头翻；下面按天分成一本本薄册子，只翻需要的那几本</text>

  <!-- ===== 上半：一本总账 ===== -->
  <text x="60" y="92" font-size="12.5" font-weight="bold" fill="#8a5a4a">不这么做的样子：一本越写越厚的总账</text>

  <rect x="60" y="106" width="330" height="230" rx="6" fill="#fdf1ec" stroke="#dba892" stroke-width="1.6"/>
  <rect x="60" y="106" width="330" height="30" rx="6" fill="#f6ddd2" stroke="#dba892" stroke-width="1.2"/>
  <text x="225" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a4a3a">全部记录 · 从第一天起</text>

  <line x1="76" y1="152" x2="374" y2="152" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="168" x2="374" y2="168" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="184" x2="374" y2="184" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="200" x2="374" y2="200" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="216" x2="374" y2="216" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="232" x2="374" y2="232" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="248" x2="374" y2="248" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="264" x2="374" y2="264" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="280" x2="374" y2="280" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="296" x2="374" y2="296" stroke="#e3c4b6" stroke-width="1"/>
  <line x1="76" y1="312" x2="374" y2="312" stroke="#e3c4b6" stroke-width="1"/>
  <text x="225" y="330" text-anchor="middle" font-size="10.5" fill="#8a6a5a">…… 一直写到今天</text>

  <rect x="430" y="150" width="270" height="70" rx="6" fill="#fdeeea" stroke="#dba892" stroke-width="1.2"/>
  <text x="565" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4a3a">想找最近七天的记录</text>
  <text x="565" y="194" text-anchor="middle" font-size="11" fill="#6a4a44">只能从头翻到尾</text>

  <rect x="430" y="246" width="270" height="70" rx="6" fill="#fdeeea" stroke="#dba892" stroke-width="1.2"/>
  <text x="565" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4a3a">想扔掉一个月前的记录</text>
  <text x="565" y="290" text-anchor="middle" font-size="11" fill="#6a4a44">只能一条条挑出来撕</text>

  <path d="M 392 190 L 426 190" fill="none" stroke="#c0a898" stroke-width="1.6" marker-end="url(#right)"/>
  <path d="M 392 282 L 426 282" fill="none" stroke="#c0a898" stroke-width="1.6" marker-end="url(#right)"/>

  <!-- ===== 中部：转变箭头 ===== -->
  <path d="M 225 340 L 225 366" fill="none" stroke="#8b98a6" stroke-width="2" marker-end="url(#down)"/>
  <text x="240" y="360" font-size="11" fill="#5a6c7d">改成：按天装订 · 到期整册丢掉</text>

  <!-- ===== 下半：按天分册 ===== -->
  <text x="60" y="404" font-size="12.5" font-weight="bold" fill="#4a7a5a">这么做的样子：一天一本薄册子</text>

  <rect x="600" y="368" width="120" height="52" rx="5" fill="#eef7f1" stroke="#8fc0a0" stroke-width="1.4"/>
  <text x="660" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c5a3a">9/01 册</text>
  <text x="660" y="407" text-anchor="middle" font-size="9.5" fill="#5a6c5d">整册可丢</text>

  <rect x="734" y="368" width="120" height="52" rx="5" fill="#eef7f1" stroke="#8fc0a0" stroke-width="1.4"/>
  <text x="794" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c5a3a">9/02 册</text>
  <text x="794" y="407" text-anchor="middle" font-size="9.5" fill="#5a6c5d">整册可丢</text>

  <rect x="868" y="368" width="120" height="52" rx="5" fill="#e8f4ec" stroke="#5aa87a" stroke-width="2"/>
  <text x="928" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f4a2c">9/03 册</text>
  <text x="928" y="407" text-anchor="middle" font-size="9.5" fill="#3a6a4a">今天还活着的也在这</text>

  <text x="600" y="426" font-size="10.5" fill="#4a6a5a">查最近几天 → 只翻这几本</text>
  <text x="868" y="426" font-size="10.5" fill="#2c5a3a">查"今天还活着" → 只看最新一本</text>
</svg>
