<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a6"/>
    </marker>
    <marker id="ar-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb0"/>
    </marker>
  </defs>

  <rect width="1280" height="660" fill="#fbfcfd"/>

  <text x="640" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2d3d">ES 告警索引轮转（ILM）组件结构</text>
  <text x="640" y="44" text-anchor="middle" font-size="11" fill="#6b7a8c">定时调度驱动编排层 → ILM 维护模板与别名 → 写入按业务时间路由、查询按时间窗推导</text>

  <!-- ===== 区域 1：编排层 ===== -->
  <rect x="24" y="68" width="1122" height="116" rx="10" fill="#f4f7fa" stroke="#c3ccd6" stroke-width="1.2"/>
  <text x="34" y="86" font-size="11.5" font-weight="bold" fill="#5a6c7d">告警域 Document 编排层</text>

  <!-- beat -->
  <rect x="40" y="90" width="150" height="64" rx="7" fill="#fdf3e7" stroke="#e0b978" stroke-width="1.4"/>
  <text x="115" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Celery beat</text>
  <text x="115" y="133" text-anchor="middle" font-size="10.5" fill="#5a6c7d">*/24 * * * *</text>

  <!-- task -->
  <rect x="230" y="90" width="190" height="64" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="325" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">rollover_indices</text>
  <text x="325" y="133" text-anchor="middle" font-size="10.5" fill="#5a6c7d">documents/tasks.py:18</text>

  <!-- rollover -->
  <rect x="460" y="90" width="200" height="64" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="560" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">BaseDocument.rollover</text>
  <text x="560" y="133" text-anchor="middle" font-size="10.5" fill="#5a6c7d">documents/base.py:221</text>

  <!-- ilm -->
  <rect x="700" y="90" width="200" height="64" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="800" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">ILM 生命周期管理</text>
  <text x="800" y="133" text-anchor="middle" font-size="10.5" fill="#5a6c7d">utils/elasticsearch/ilm.py:29</text>

  <!-- template -->
  <rect x="950" y="90" width="180" height="64" rx="7" fill="#eaf5ee" stroke="#8fc0a0" stroke-width="1.4"/>
  <text x="1040" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">索引模板</text>
  <text x="1040" y="133" text-anchor="middle" font-size="10.5" fill="#5a6c7d">pattern {index}_*</text>

  <!-- ===== 区域 2：存储层 ===== -->
  <rect x="140" y="280" width="1000" height="118" rx="10" fill="#f4f7fa" stroke="#c3ccd6" stroke-width="1.2"/>
  <text x="150" y="298" font-size="11.5" font-weight="bold" fill="#5a6c7d">Elasticsearch 存储层</text>

  <!-- write_alias -->
  <rect x="160" y="300" width="220" height="78" rx="7" fill="#f3eefa" stroke="#b3a0cc" stroke-width="1.4"/>
  <text x="270" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">写别名</text>
  <text x="270" y="350" text-anchor="middle" font-size="10.5" fill="#5a6c7d">write_{date}_{index}</text>
  <text x="270" y="366" text-anchor="middle" font-size="9" fill="#8a97a5">唯一 · 永远指向最新</text>

  <!-- phys -->
  <rect x="520" y="300" width="240" height="78" rx="7" fill="#eaf5ee" stroke="#8fc0a0" stroke-width="1.4"/>
  <text x="640" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">物理索引</text>
  <text x="640" y="350" text-anchor="middle" font-size="10.5" fill="#5a6c7d">{index}_{YYYYMMDD}_{seq}</text>
  <text x="640" y="366" text-anchor="middle" font-size="9" fill="#8a97a5">按天切片 · 按 50GB 分裂</text>

  <!-- read_alias -->
  <rect x="900" y="300" width="220" height="78" rx="7" fill="#f3eefa" stroke="#b3a0cc" stroke-width="1.4"/>
  <text x="1010" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">读别名</text>
  <text x="1010" y="350" text-anchor="middle" font-size="10.5" fill="#5a6c7d">{index}_{date}_read</text>
  <text x="1010" y="366" text-anchor="middle" font-size="9" fill="#8a97a5">多份并存 · 永久驻留</text>

  <!-- ===== 消费层 ===== -->
  <rect x="90" y="530" width="240" height="70" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="210" y="556" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">写入侧</text>
  <text x="210" y="575" text-anchor="middle" font-size="10.5" fill="#5a6c7d">alarm_backends 告警接入</text>

  <rect x="495" y="530" width="270" height="70" rx="7" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="630" y="556" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">过期清理</text>
  <text x="630" y="575" text-anchor="middle" font-size="10.5" fill="#5a6c7d">clear_expired_indices（未启用）</text>

  <rect x="940" y="530" width="240" height="70" rx="7" fill="#fdf0f3" stroke="#dba3b3" stroke-width="1.4"/>
  <text x="1060" y="556" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">查询侧</text>
  <text x="1060" y="575" text-anchor="middle" font-size="10.5" fill="#5a6c7d">fta_web 告警列表 / 详情</text>

  <!-- ===== 连线：编排层主链路 ===== -->
  <path d="M 190 122 L 226 122" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#ar-e)"/>
  <text x="208" y="174" text-anchor="middle" font-size="10" fill="#4a5b6c">每 24 分钟</text>

  <path d="M 420 122 L 456 122" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#ar-e)"/>
  <text x="438" y="174" text-anchor="middle" font-size="10" fill="#4a5b6c">遍历 10 个 Document</text>

  <path d="M 660 122 L 696 122" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#ar-e)"/>
  <text x="678" y="174" text-anchor="middle" font-size="10" fill="#4a5b6c">装配 ILM 参数</text>

  <path d="M 900 122 L 946 122" fill="none" stroke="#8b98a6" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="923" y="174" text-anchor="middle" font-size="10" fill="#4a5b6c">upsert_template()</text>

  <!-- ILM → 写别名 -->
  <path d="M 800 154 L 800 215 L 270 215 L 270 296" fill="none" stroke="#8b98a6" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="430" y="206" text-anchor="middle" font-size="10" fill="#4a5b6c">别名创建与预留</text>

  <!-- ILM → 物理索引 -->
  <path d="M 760 154 L 760 255 L 640 255 L 640 296" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#ar-e)"/>
  <text x="640" y="246" text-anchor="middle" font-size="10" fill="#4a5b6c">建索引 / reindex 搬运</text>

  <!-- 写别名 → 物理索引 → 读别名 -->
  <path d="M 380 339 L 516 339" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#ar-e)"/>
  <text x="448" y="294" text-anchor="middle" font-size="10" fill="#4a5b6c">唯一指向最新</text>

  <path d="M 760 339 L 896 339" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#ar-e)"/>
  <text x="828" y="294" text-anchor="middle" font-size="10" fill="#4a5b6c">永久驻留不迁移</text>

  <!-- 写入侧 → 写别名 -->
  <path d="M 210 530 L 210 440 L 270 440 L 270 382" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#ar-e)"/>
  <text x="270" y="458" text-anchor="middle" font-size="10" fill="#4a5b6c">按 begin_time 路由</text>

  <!-- 读别名 → 查询侧 -->
  <path d="M 1010 378 L 1010 440 L 1060 440 L 1060 526" fill="none" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#ar-e)"/>
  <text x="1060" y="458" text-anchor="middle" font-size="10" fill="#4a5b6c">按时间窗推导索引</text>

  <!-- 物理索引 → 过期清理（未启用） -->
  <path d="M 630 378 L 630 526" fill="none" stroke="#b0b8c2" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="662" y="500" font-size="10" fill="#8a97a5">clean_index() 删除过期索引</text>

  <!-- ===== 图例 ===== -->
  <rect x="40" y="624" width="12" height="12" rx="2" fill="#fdf3e7" stroke="#e0b978"/>
  <text x="58" y="634" font-size="10" fill="#5a6c7d">外部调度</text>
  <rect x="140" y="624" width="12" height="12" rx="2" fill="#eef3f8" stroke="#9fb3c8"/>
  <text x="158" y="634" font-size="10" fill="#5a6c7d">服务逻辑</text>
  <rect x="245" y="624" width="12" height="12" rx="2" fill="#eaf5ee" stroke="#8fc0a0"/>
  <text x="263" y="634" font-size="10" fill="#5a6c7d">存储</text>
  <rect x="320" y="624" width="12" height="12" rx="2" fill="#f3eefa" stroke="#b3a0cc"/>
  <text x="338" y="634" font-size="10" fill="#5a6c7d">别名</text>
  <rect x="390" y="624" width="12" height="12" rx="2" fill="#fdf0f3" stroke="#dba3b3"/>
  <text x="408" y="634" font-size="10" fill="#5a6c7d">前端 / 查询</text>

  <path d="M 1160 630 L 1196 630" fill="none" stroke="#b0b8c2" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="1204" y="634" font-size="10" fill="#8a97a5">当前未启用</text>
</svg>
