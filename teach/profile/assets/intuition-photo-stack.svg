<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">同样一堆记录，换个摆法，重点自己浮出来</text>

  <!-- 左侧：摊开 -->
  <rect x="28" y="56" width="406" height="352" rx="10" fill="#ffffff" stroke="#d7dee7"/>
  <text x="231" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#33475b">摆法一 · 一条条摊开看</text>

  <g>
    <rect x="56" y="102" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="70" y="102" width="40" height="12" rx="3" fill="#5b8ff9"/>
    <rect x="56" y="120" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="150" y="120" width="40" height="12" rx="3" fill="#61ddaa"/>
    <rect x="56" y="138" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="270" y="138" width="40" height="12" rx="3" fill="#f6bd16"/>
    <rect x="56" y="156" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="70" y="156" width="40" height="12" rx="3" fill="#5b8ff9"/>
    <rect x="56" y="174" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="150" y="174" width="40" height="12" rx="3" fill="#61ddaa"/>
    <rect x="56" y="192" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="70" y="192" width="40" height="12" rx="3" fill="#5b8ff9"/>
    <rect x="56" y="210" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="70" y="210" width="40" height="12" rx="3" fill="#5b8ff9"/>
    <rect x="56" y="228" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="150" y="228" width="40" height="12" rx="3" fill="#61ddaa"/>
    <rect x="56" y="246" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="270" y="246" width="40" height="12" rx="3" fill="#f6bd16"/>
    <rect x="56" y="264" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="70" y="264" width="40" height="12" rx="3" fill="#5b8ff9"/>
    <rect x="56" y="282" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="150" y="282" width="40" height="12" rx="3" fill="#61ddaa"/>
    <rect x="56" y="300" width="340" height="12" rx="3" fill="#eef1f5"/>
    <rect x="70" y="300" width="40" height="12" rx="3" fill="#5b8ff9"/>
  </g>

  <text x="231" y="336" text-anchor="middle" font-size="14" fill="#52606d">一条一行，一共 12 行</text>
  <text x="231" y="360" text-anchor="middle" font-size="14" fill="#52606d">谁多谁少，得一条条数过去</text>
  <text x="231" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#c0442f">看得全，看不出重点</text>

  <!-- 箭头 -->
  <path d="M444 232 L462 232" stroke="#7b8794" stroke-width="2"/>
  <path d="M456 225 L464 232 L456 239 Z" fill="#7b8794"/>

  <!-- 右侧：叠起来 -->
  <rect x="466" y="56" width="406" height="352" rx="10" fill="#ffffff" stroke="#d7dee7"/>
  <text x="669" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#33475b">摆法二 · 按去处叠在一起</text>

  <text x="500" y="126" font-size="14" fill="#33475b">客厅</text>
  <rect x="556" y="112" width="240" height="24" rx="4" fill="#5b8ff9"/>
  <text x="806" y="129" font-size="13" fill="#ffffff">6</text>

  <text x="500" y="166" font-size="14" fill="#33475b">厨房</text>
  <rect x="556" y="152" width="160" height="24" rx="4" fill="#61ddaa"/>
  <text x="726" y="169" font-size="13" fill="#33475b">4</text>

  <text x="500" y="206" font-size="14" fill="#33475b">书房</text>
  <rect x="556" y="192" width="80" height="24" rx="4" fill="#f6bd16"/>
  <text x="646" y="209" font-size="13" fill="#33475b">2</text>

  <path d="M556 240 L796 240" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="556" y="262" font-size="13" fill="#7b8794">0</text>
  <text x="766" y="262" font-size="13" fill="#7b8794">12 次</text>

  <text x="669" y="300" text-anchor="middle" font-size="14" fill="#52606d">同一批记录，只是换了摆法</text>
  <text x="669" y="324" text-anchor="middle" font-size="14" fill="#52606d">越宽的一块，就是待得越久的那个</text>
  <text x="669" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#1f7a4d">不用数，重点自己跳出来</text>
  <text x="669" y="384" text-anchor="middle" font-size="13" fill="#7b8794">（本图是类比，不是真实界面）</text>
</svg>
