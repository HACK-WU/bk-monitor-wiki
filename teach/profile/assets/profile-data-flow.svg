<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d3b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">APM Profiling 端到端数据流</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#5c6b7a">实线 = 经过本模块的调用；虚线 = 模块外部的数据通路</text>

  <!-- 泳道 1：数据产生侧 -->
  <rect x="20" y="60" width="860" height="105" fill="#eef4fb" stroke="#c3d6ea" rx="6"/>
  <text x="32" y="80" font-size="13" font-weight="bold" fill="#3a6ea5">① 数据产生侧（模块外部）</text>

  <rect x="40" y="90" width="200" height="56" fill="#e8f1fb" stroke="#3a6ea5" rx="5"/>
  <text x="140" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">应用探针 / SDK</text>
  <text x="140" y="131" text-anchor="middle" font-size="11" fill="#41546b">pprof 二进制 · OTLP 上报</text>

  <rect x="350" y="90" width="200" height="56" fill="#e8f1fb" stroke="#3a6ea5" rx="5"/>
  <text x="450" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">用户手工上传</text>
  <text x="450" y="131" text-anchor="middle" font-size="11" fill="#41546b">pprof / perf_script 文件</text>

  <rect x="660" y="90" width="200" height="56" fill="#e8f1fb" stroke="#3a6ea5" rx="5"/>
  <text x="760" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">DeepFlow</text>
  <text x="760" y="131" text-anchor="middle" font-size="11" fill="#41546b">eBPF Profile（ebpf- 前缀）</text>

  <!-- 泳道 2：本模块 -->
  <rect x="20" y="180" width="860" height="205" fill="#eefaf1" stroke="#bfe0c9" rx="6"/>
  <text x="32" y="200" font-size="13" font-weight="bold" fill="#2f7a4f">② profile 模块（本模块）</text>

  <rect x="40" y="215" width="200" height="54" fill="#e8f6ec" stroke="#2f7a4f" rx="5"/>
  <text x="140" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">上传解析链路</text>
  <text x="140" y="256" text-anchor="middle" font-size="11" fill="#41546b">file_handler + 解析器</text>

  <rect x="350" y="215" width="200" height="54" fill="#e8f6ec" stroke="#2f7a4f" rx="5"/>
  <text x="450" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">查询入口</text>
  <text x="450" y="256" text-anchor="middle" font-size="11" fill="#41546b">ProfileQueryViewSet</text>

  <rect x="660" y="215" width="200" height="54" fill="#e8f6ec" stroke="#2f7a4f" rx="5"/>
  <text x="760" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">eBPF 查询入口</text>
  <text x="760" y="256" text-anchor="middle" font-size="11" fill="#41546b">ebpf_query（不查 Doris）</text>

  <rect x="40" y="315" width="190" height="54" fill="#e8f6ec" stroke="#2f7a4f" rx="5"/>
  <text x="135" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">TreeConverter 建树</text>
  <text x="135" y="356" text-anchor="middle" font-size="11" fill="#41546b">Doris 行 → FunctionTree</text>

  <rect x="270" y="315" width="170" height="54" fill="#e8f6ec" stroke="#2f7a4f" rx="5"/>
  <text x="355" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">Diagrammer 出图</text>
  <text x="355" y="356" text-anchor="middle" font-size="11" fill="#41546b">火焰图 / 表格 / 调用图</text>

  <text x="560" y="337" font-size="12" fill="#2f7a4f">页面主链路：不经过 pprof</text>
  <text x="560" y="356" font-size="12" fill="#2f7a4f">导出链路：才转 Profile 对象</text>

  <!-- 泳道 3：外部系统 -->
  <rect x="20" y="400" width="860" height="150" fill="#fdf6e8" stroke="#e6d3ab" rx="6"/>
  <text x="32" y="420" font-size="13" font-weight="bold" fill="#a5761f">③ 外部系统（被本模块调用）</text>

  <rect x="30" y="435" width="185" height="56" fill="#fdf1dd" stroke="#a5761f" rx="5"/>
  <text x="122" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">bkrepo</text>
  <text x="122" y="476" text-anchor="middle" font-size="11" fill="#5b4a2a">蓝鲸制品库对象存储</text>

  <rect x="245" y="435" width="185" height="56" fill="#fdf1dd" stroke="#a5761f" rx="5"/>
  <text x="337" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">bk-collector</text>
  <text x="337" y="476" text-anchor="middle" font-size="11" fill="#5b4a2a">/pyroscope/ingest 接入</text>

  <rect x="460" y="435" width="185" height="56" fill="#fdf1dd" stroke="#a5761f" rx="5"/>
  <text x="552" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">DeepFlow 服务</text>
  <text x="552" y="476" text-anchor="middle" font-size="11" fill="#5b4a2a">query_ebpf_profile</text>

  <rect x="675" y="435" width="185" height="56" fill="#fdf1dd" stroke="#a5761f" rx="5"/>
  <text x="767" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">Doris</text>
  <text x="767" y="476" text-anchor="middle" font-size="11" fill="#5b4a2a">经 bkdata 统一查询接口</text>

  <!-- 连线：上传链路 -->
  <path d="M 450 146 L 450 168 L 140 168 L 140 215" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 140 269 L 140 285 L 122 285 L 122 435" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 140 285 L 337 285 L 337 435" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 230 342 L 270 342" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 连线：查询链路 -->
  <path d="M 450 269 L 450 392 L 767 392 L 767 435" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 450 269 L 450 300 L 135 300 L 135 315" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 连线：eBPF 链路 -->
  <path d="M 760 269 L 760 305 L 552 305 L 552 435" fill="none" stroke="#34495e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 外部通路（虚线） -->
  <path d="M 140 146 L 140 160 L 337 160 L 337 435" fill="none" stroke="#8a6d3b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <path d="M 430 463 L 675 463" fill="none" stroke="#8a6d3b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>

  <text x="352" y="152" font-size="11" fill="#8a6d3b">探针数据直连接入侧</text>
  <text x="452" y="458" font-size="11" fill="#8a6d3b">BkData 清洗入库</text>
  <text x="775" y="300" font-size="11" fill="#34495e">查询</text>
  <text x="770" y="378" font-size="11" fill="#34495e">返回 sample 行</text>

  <text x="450" y="580" text-anchor="middle" font-size="12" fill="#5c6b7a">出图结果经 ProfileQueryViewSet 返回前端；Grafana 数据源插件走同一套 converter_query + converter_to_data</text>
</svg>
